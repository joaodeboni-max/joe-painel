const createIcon = name => {
  return function LucideIcon(props) {
    const ref = React.useRef(null);
    React.useEffect(() => {
      if (ref.current && lucide.icons[name]) {
        const [tag, attrs, children] = lucide.icons[name];
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        Object.entries({
          ...attrs,
          width: props.size || 24,
          height: props.size || 24,
          stroke: props.color || "currentColor",
          "stroke-width": props.strokeWidth || 2,
          class: props.className || ""
        }).forEach(([k, v]) => svg.setAttribute(k, v));
        children.forEach(([ctag, cattrs]) => {
          const el = document.createElementNS("http://www.w3.org/2000/svg", ctag);
          Object.entries(cattrs).forEach(([k, v]) => el.setAttribute(k, v));
          svg.appendChild(el);
        });
        ref.current.innerHTML = "";
        ref.current.appendChild(svg);
      }
    }, [props.size, props.color, props.className]);
    return React.createElement("span", {
      ref,
      style: {
        display: "inline-flex",
        alignItems: "center",
        ...props.style
      }
    });
  };
};
